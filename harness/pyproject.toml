[project]
name = "chipharness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pymongo>=4.8",
  "python-dotenv>=1.0",
  "openai>=1.40",          # OpenRouter is OpenAI-compatible
  "langgraph>=0.2",
  "langgraph-checkpoint-mongodb>=0.1",
  "langsmith>=0.1",
  "strands-agents>=1.0",
  "strands-agents[openai]>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
